<!DOCTYPE html>
<html>
<head>
    <title>Login - Tienda JAR</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="login-body">

<div class="login-box">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="correo" placeholder="Correo" class="login-input">
    <input type="password" id="password" placeholder="Contraseña" class="login-input">

    <button class="login-btn" onclick="login()">Ingresar</button>
</div>

<script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>

    <header class="bg-success text-white text-center p-3">
        <h1>Productos</h1>
    </header>

    <nav class="nav-menu">
        <ul class="nav-list">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="empleados.html">Empleados</a></li>
            <li><a href="carrito.html">Carrito</a></li>
            <li><a href="login.html">Cerrar Sesión</a></li>
        </ul>
    </nav>

    <main class="container mt-4">

        <h2>Agregar / Editar Producto</h2>
        <input type="hidden" id="txtId">
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <input type="text" id="txtNombre" class="form-control" placeholder="Nombre">
            </div>
            <div class="col-md-3">
                <input type="text" id="txtMarca" class="form-control" placeholder="Marca">
            </div>
            <div class="col-md-2">
                <input type="number" id="txtPrecio" class="form-control" placeholder="Precio">
            </div>
            <div class="col-md-2">
                <input type="number" id="txtStock" class="form-control" placeholder="Stock">
            </div>
            <div class="col-md-2">
                <button id="btnAdd" class="btn btn-success w-100">
                    Guardar
                </button>
            </div>
        </div>

        <section>
            <h2 class="mb-3">Lista de Productos</h2>

            <button id="btnLoad" class="btn btn-primary mb-3">
                Refrescar Productos
            </button>

            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Marca</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tbodyProductos"></tbody>

            </table>
        </section>
    </main>

    <footer class="text-center p-3">
        <p>&copy; 2026 Tienda de accesorios de PC</p>
        <p>Contacto: <a href="mailto:jarley@gmail.com">Jarley</a></p>
    </footer>

    <script type="module" src="./js/apps.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
